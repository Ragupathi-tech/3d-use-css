<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Model Viewer Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

 

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: url('https://i.pinimg.com/736x/aa/50/4d/aa504de17ce2526fb90cb7ca8edc496a.jpg') no-repeat center/cover;
}

model-viewer {
  width: 100%;
  height: 80vh;
  background: transparent;
}

/* Buttons */
.btn-container {
  margin: 15px;
}

button {
  padding: 12px 25px;
  margin: 8px;
  font-size: 16px;
  border: none;
  border-radius: 25px;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.stop-btn { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
.run-btn { background: linear-gradient(45deg, #36d1dc, #5b86e5); }
.wave-btn { background: linear-gradient(45deg, #f7971e, #ffd200); }

button:hover {
  transform: scale(1.1);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<model-viewer 
  id="model"
  src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
  auto-rotate 
  camera-controls
  autoplay
  animation-name="Walking"
  animation-loop>
</model-viewer>

<div class="btn-container">
  <button class="stop-btn" onclick="stopAnim()">STOP</button>
  <button class="run-btn" onclick="run()">RUN</button>
  <button class="wave-btn" onclick="wave()">WAVE</button>
</div>

<script>
var modelViewer = document.getElementById('model');

function stopAnim() {
  modelViewer.animationName = ''; // FULL STOP
}

function run() {
  modelViewer.animationName = 'Running';
}

function wave() {
  modelViewer.animationName = 'Wave';
}
</script>
</body>
</html>
